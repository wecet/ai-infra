name: 🐞 Bug Report
about: Create a report to help us improve
title: "🐞[BUG] "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: Clearly describe the bug
      placeholder: What happened?

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should have happened?

  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened?

  - type: input
    attributes:
      label: Environment
      placeholder: e.g. OS, browser, version

  - type: textarea
    attributes:
      label: Logs / Screenshots
      description: Paste logs or attach screenshots if available