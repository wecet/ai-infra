name: 📝 Documentation Issue
about: Report an issue or suggest improvements to documentation
title: "📝[DOCS] "
labels: ["documentation"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What is wrong or missing in the documentation?
      placeholder: Describe the issue clearly

  - type: dropdown
    attributes:
      label: Type of Documentation Issue
      options:
        - Missing documentation
        - Incorrect information
        - Outdated content
        - Unclear explanation
        - Typo / grammar issue
      default: 0

  - type: input
    attributes:
      label: Location
      description: Where is the issue? (URL, file path, section)
      placeholder: e.g. /docs/setup.md

  - type: textarea
    attributes:
      label: Suggested Improvement
      description: How should it be fixed or improved?

  - type: textarea
    attributes:
      label: Additional Context
      description: Screenshots, references, or examples