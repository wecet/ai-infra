name: ❗ Epic
about: A large body of work that can be broken down into smaller tasks or stories
title: "❗[EPIC] "
labels: ["epic"]
body:
  - type: textarea
    attributes:
      label: Epic Overview
      description: High-level description of the epic
      placeholder: What is this epic about?

  - type: textarea
    attributes:
      label: Goal / Outcome
      description: What is the desired outcome or business value?

  - type: textarea
    attributes:
      label: Scope
      description: What is included and excluded in this epic?

  - type: textarea
    attributes:
      label: Child Issues / Tasks
      description: List related tasks or user stories
      placeholder: |
        - [ ] #123 Task 1
        - [ ] #124 Task 2

  - type: dropdown
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
      default: 1

  - type: input
    attributes:
      label: Milestone (optional)
      placeholder: e.g. v1.0 release

  - type: textarea
    attributes:
      label: Additional Notes
      description: Dependencies, risks, or extra context