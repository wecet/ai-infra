name: 🧩 Task
about: A specific piece of work to be completed
title: "🧩[TASK] "
labels: ["task"]
body:
  - type: textarea
    attributes:
      label: Task Description
      description: What needs to be done?

  - type: textarea
    attributes:
      label: Acceptance Criteria
      description: What defines completion?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2

  - type: textarea
    attributes:
      label: Implementation Notes
      description: Technical details, constraints, or ideas

  - type: dropdown
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
      default: 1

  - type: input
    attributes:
      label: Related Issues
      placeholder: #123, #456