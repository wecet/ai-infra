name: Publish ai_interfaces release

on:
  push:
    tags:
      - "ai-interfaces-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example ai-interfaces-v0.2.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ai-interfaces-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build Python package and GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$VERSION" =~ ^ai-interfaces-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use ai-interfaces-vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          PACKAGE_VERSION="${VERSION#ai-interfaces-v}"
          DECLARED_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' libs/ai_interfaces/pyproject.toml)"
          if [[ "$PACKAGE_VERSION" != "$DECLARED_VERSION" ]]; then
            echo "Tag $PACKAGE_VERSION does not match package version $DECLARED_VERSION" >&2
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: libs/ai_interfaces/pyproject.toml

      - name: Install build and test tools
        run: python -m pip install --upgrade build pytest -e libs/ai_interfaces

      - name: Run contract tests
        run: python -m pytest -q libs/ai_interfaces/tests
        env:
          PYTHONPATH: libs/ai_interfaces/src

      - name: Build wheel and source distribution
        run: python -m build libs/ai_interfaces --outdir dist

      - name: Verify package metadata
        run: python -m pip install --dry-run dist/*.whl

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package }}
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## ai-infra interfaces ${PACKAGE_VERSION}

          Install the attached wheel:

          \`pip install https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ai_infra_interfaces-${PACKAGE_VERSION}-py3-none-any.whl\`

          Includes framework-neutral classification, detection and anomaly contracts, described Pydantic fields, and optional TrainingContext.report_progress events. Existing trainers remain compatible when the progress callback is absent.

          The source distribution is attached for source-based installation and auditing.
          EOF
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ai-infra interfaces ${PACKAGE_VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            dist/*
