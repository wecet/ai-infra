name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (major, minor, patch, hash)'
        required: true
        default: 'hash'
        type: choice
        options:
          - major
          - minor
          - patch
          - hash

jobs:
  # You need the build app, as the build flow expects at least one artifact.
  build:
#   env:
#     UV_INDEX_OPENIIOT_USERNAME: ${{ secrets.PUBLISH_USER }}
#     UV_INDEX_OPENIIOT_PASSWORD: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: echo "dummy" > dummy

      - uses: actions/upload-artifact@v3
        with:
          name: dummy
          path: dummy

  publish:
    # TODO:
    # The current version of the act_runner does not resolve secrets properly for reusable workflows.
    # The hardcoded app token below is a temporary fix, until the fix for gitea is release.
    # The token has ONLY read rights on the workflow repo, so exposure is managed!
    # NOTE:
    # we reference a specific tag (version) of the reusable workflow, as otherwise, the runner uses an old one from its cache.
    needs: build
    uses: https://2c4f9f0cb032bd4876f10e6593452f6569e8bfa2:@git.openiiot.systems/OpenIIoT/workflows/.github/workflows/uv_publish.yml@v1.4.0
    with:
      bump_type: ${{ github.event.inputs.bump_type }}
    secrets:
      PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
