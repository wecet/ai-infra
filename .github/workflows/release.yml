name: Publish labeller release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/labelling

jobs:
  publish:
    name: Container package and GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Labelling Studio
            org.opencontainers.image.description=Image classification and object detection labelling workspace
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish multi-platform package
        uses: docker/build-push-action@v6
        with:
          context: ./src/labelling
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build downloadable OCI image archive
        uses: docker/build-push-action@v6
        with:
          context: ./src/labelling
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/labelling-${{ steps.version.outputs.value }}-linux-amd64.tar
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha

      - name: Prepare release files
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gzip -9 "${RUNNER_TEMP}/labelling-${VERSION}-linux-amd64.tar"
          cp docker-compose.yml "${RUNNER_TEMP}/docker-compose.yml"
          cp .env.example "${RUNNER_TEMP}/env.example"
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          ## Labelling Studio ${VERSION}

          Container package:

          \`docker pull ghcr.io/${GITHUB_REPOSITORY}/labelling:${VERSION}\`

          The attached OCI archive is provided for offline Linux AMD64 installations. The Compose and environment templates are included for complete-stack deployment.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Labelling Studio $VERSION" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "$VERSION" --clobber \
              "${RUNNER_TEMP}/labelling-${VERSION}-linux-amd64.tar.gz" \
              "${RUNNER_TEMP}/docker-compose.yml" \
              "${RUNNER_TEMP}/env.example"
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "Labelling Studio $VERSION" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              "${RUNNER_TEMP}/labelling-${VERSION}-linux-amd64.tar.gz" \
              "${RUNNER_TEMP}/docker-compose.yml" \
              "${RUNNER_TEMP}/env.example"
          fi
