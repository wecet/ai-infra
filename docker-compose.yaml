# Local Compose runner; Deployment Manager reads services/ instead.
services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
    - '5432'
    volumes:
    - postgres_data:/var/lib/postgresql/data
  mlflow:
    image: ${MLFLOW_IMAGE}
    container_name: mlops-mlflow
    restart: unless-stopped
    depends_on:
    - postgres
    ports:
    - ${MLFLOW_PORT}:5000
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ''
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ''
    command:
    - mlflow
    - server
    - --host
    - 0.0.0.0
    - --port
    - '5000'
    - --disable-security-middleware
  lakefs:
    image: ${LAKEFS_IMAGE}
    container_name: mlops-lakefs
    restart: unless-stopped
    depends_on:
    - postgres
    ports:
    - ${LAKEFS_PORT}:8000
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}
      LAKEFS_BLOCKSTORE_TYPE: local
      LAKEFS_LOCAL_PATH: /data
    volumes:
    - lakefs_data:/data
  labelling:
    build: ./src/labelling
    container_name: mlops-labelling
    restart: unless-stopped
    environment:
      LABELLING_DATA_DIR: /data
    volumes:
    - labelling_data:/data
    image: ${LABELLING_IMAGE}
    ports:
    - ${LABELLING_PORT}:8080
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME}
  lakefs_data:
    name: ${LAKEFS_VOLUME}
  labelling_data:
    name: ${LABELLING_VOLUME}
