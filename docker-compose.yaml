services:
  postgres:
    image: postgres:16
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops-mlflow
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5000:5000"
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ""
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ""
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --disable-security-middleware

  lakefs:
    image: treeverse/lakefs:latest
    container_name: mlops-lakefs
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${LAKEFS_PORT:-8001}:8000"
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}
      LAKEFS_BLOCKSTORE_TYPE: local
      LAKEFS_LOCAL_PATH: /data
    volumes:
      - lakefs_data:/data

  labelling:
    build: ./labelling
    container_name: mlops-labelling
    restart: unless-stopped
    environment:
      LABELLING_DATA_DIR: /data
    expose:
      - "8080"
    volumes:
      - labelling_data:/data

  nginx:
    image: nginx:alpine
    container_name: mlops-nginx
    restart: unless-stopped
    depends_on:
      - mlflow
      - lakefs
      - labelling
    ports:
      - "8088:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  postgres_data:
  lakefs_data:
  labelling_data:
