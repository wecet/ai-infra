services:
  postgres:
    image: postgres:16
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: mlops-seaweedfs
    restart: unless-stopped
    command: "server -s3 -dir=/data"
    expose:
      - "8333"
      - "9333"
      - "8888"
    ports:
      - "${SEAWEED_S3_PORT}:8333"
    volumes:
      - seaweedfs_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops-mlflow
    restart: unless-stopped
    depends_on:
      - postgres
      - seaweedfs
    expose:
      - "5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow.openiiot.mlops,192.168.0.19,localhost,127.0.0.1
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"

  lakefs:
    image: treeverse/lakefs:latest
    container_name: mlops-lakefs
    restart: unless-stopped
    depends_on:
      - postgres
      - seaweedfs
    expose:
      - "8000"
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY}
      LAKEFS_BLOCKSTORE_TYPE: local
      LAKEFS_LOCAL_PATH: /data
    volumes:
      - lakefs_data:/data

  nginx:
    image: nginx:alpine
    container_name: mlops-nginx
    restart: unless-stopped
    depends_on:
      - mlflow
      - lakefs
      - seaweedfs
    ports:
      - "8088:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

volumes:
  postgres_data:
  seaweedfs_data:
  lakefs_data: