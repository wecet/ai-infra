[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-interfaces"
version = "0.3.0"
description = "Stable model contracts for the ai-infra training platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]
license = "MIT"
authors = [{ name = "ai-infra contributors" }]

[tool.setuptools.packages.find]
where = ["src"]
