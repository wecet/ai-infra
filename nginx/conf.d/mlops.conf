server {
    listen 80;
    server_name mlflow.openiiot.mlops;

    location / {
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_pass http://mlops-mlflow:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name lakefs.openiiot.mlops;

    client_max_body_size 10G;
    proxy_request_buffering off;

    location / {
        proxy_pass http://mlops-lakefs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name labelling.openiiot.mlops;

    client_max_body_size 55M;

    location / {
        proxy_pass http://mlops-labelling:8080;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
