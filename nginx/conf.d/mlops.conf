server {
    listen 80;
    server_name mlflow.openiiot.mlops;

    location / {
        proxy_pass http://mlops-mlflow:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name lakefs.openiiot.mlops;

    client_max_body_size 10G;
    proxy_request_buffering off;

    location / {
        proxy_pass http://mlops-lakefs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name seaweed.openiiot.mlops;

    location / {
        proxy_pass http://mlops-seaweedfs:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}