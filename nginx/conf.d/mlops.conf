server {
    listen 80;
    server_name mlflow.openiiot.mlops;

    location / {
        client_max_body_size 10G;
        proxy_request_buffering off;
        proxy_pass http://mlops-mlflow:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name lakefs.openiiot.mlops;

    client_max_body_size 10G;
    proxy_request_buffering off;

    location / {
        proxy_pass http://mlops-lakefs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name portainer.openiiot.mlops;

    location / {
        proxy_pass https://mlops-portainer:9443;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name seaweed.openiiot.mlops;

    location / {
        proxy_pass http://mlops-seaweedfs:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}