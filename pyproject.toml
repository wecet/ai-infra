# FIXME:
# Replace `package_name` with the name of your package.

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "package_name"                       ##### FIXME: UPDATE 'package_name'
version = "0.0.0"
description = "Package description"         ##### FIXME: UPDATE 'package description'
readme = "README.MD"
authors = [
    { name = "OpenIIoT Ltd", email = "info@openiiot.io" }
]
maintainers = [
    { name = "OpenIIoT Ltd", email = "info@openiiot.io" }
]
license = "LicenseRef-OpenIIoTProprietary"
keywords = ["OpenIIoT", "Interface", "Library", "Python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux"
]
requires-python = "==3.13.*"
dependencies = [                            ##### FIXME: UPDATE THESE
    "web-app-library>=1.0.0",
]

[dependency-groups]
dev = [                                     ##### FIXME: UPDATE THESE
    "mypy>=1.15.0",
    "pytest>=8.3.5",
]

[tool.setuptools]
packages = ["package_name"]                ##### FIXME: UPDATE 'package_name'
package-dir = {"" = "."}
include-package-data = true

# [tool.setuptools.package-data]
# package_name = ["*.so"]                  ##### FIXME: UPDATE THESE IS APPLICABLE

[project.urls]                             ##### FIXME: UPDATE 'package_name'
Homepage = "https://git.openiiot.systems/OpenIIoT/package_name"
Issues = "https://git.openiiot.systems/OpenIIoT/package_name/issues"

[[tool.uv.index]]
name = "openiiot"
url = "https://git.openiiot.systems/api/packages/OpenIIoT/pypi/simple/"
publish-url = "https://git.openiiot.systems/api/packages/OpenIIoT/pypi/"
