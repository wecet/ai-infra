spec_version: '1'
kind: service
service:
  host: ~~ENV:HOST_APP~~
  id: labelling
  project_name: ai-infra
  name: Labelling Studio
  type: container
  image: ~~ENV:LABELLING_IMAGE~~
  restart: unless-stopped
  aliases:
  - mlops-labelling
  networks:
  - id: ~~ENV:NETWORK_NAME~~
    internal: false
  environment:
    LABELLING_DATA_DIR: /data
    GPT_ENV_FILE: /app/gpt.env
    LAKEFS_ENV_FILE: /app/lakefs.env
  volumes:
  - type: bind
    source: gpt.env
    target: /app/gpt.env
    readonly: true
    replace: true
  - type: bind
    source: lakefs.env
    target: /app/lakefs.env
    readonly: true
    replace: true
  - type: volume
    source: labelling_data
    name: ~~ENV:LABELLING_VOLUME~~
    target: /data
  logging:
    driver: json-file
    options:
      max-size: ~~ENV:LOG_MAX_SIZE~~
      max-file: ~~ENV:LOG_MAX_FILE~~
  ports:
  - host: ~~ENV:LABELLING_PORT~~
    container: 8080
