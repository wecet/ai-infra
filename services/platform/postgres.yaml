spec_version: '1'
kind: service
service:
  host: ~~ENV:HOST_APP~~
  id: postgres
  project_name: ai-infra
  name: Postgres
  type: container
  image: ~~ENV:POSTGRES_IMAGE~~
  restart: unless-stopped
  aliases:
  - mlops-postgres
  networks:
  - id: ~~ENV:NETWORK_NAME~~
    internal: false
  environment:
    POSTGRES_USER: ~~ENV:POSTGRES_USER~~
    POSTGRES_PASSWORD: ~~ENV:POSTGRES_PASSWORD~~
    POSTGRES_DB: ~~ENV:POSTGRES_DB~~
  volumes:
  - type: volume
    source: postgres_data
    name: ~~ENV:POSTGRES_VOLUME~~
    target: /var/lib/postgresql/data
  logging:
    driver: json-file
    options:
      max-size: ~~ENV:LOG_MAX_SIZE~~
      max-file: ~~ENV:LOG_MAX_FILE~~
